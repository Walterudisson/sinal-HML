name: Sinal Segurança HML - Anexos

on:
  pull_request:
    paths:
      - 'storage.rules'
      - 'firestore.rules'
      - 'firebase.json'
      - 'tests/storage-*'
      - 'package.json'
      - 'functions/access-revocation.js'
      - 'functions/access-revocation.test.cjs'
      - 'functions/index.js'
      - 'functions/attachment-security.js'
      - 'functions/attachment-security.test.cjs'
      - 'functions/package.json'
      - 'js/services/attachments.service.js'
      - 'js/services/attachment-cancel.mjs'
      - 'tests/attachment-cancel-1.7.0-b.test.mjs'
      - 'js/ui/ticket-detail.js'
      - 'js/ui/overlay-history.js'
      - 'js/ui/signal-composer.js'
      - 'tests/overlay-preview-navigation-1.7.0-c.test.mjs'
      - 'tests/sprint-1.7.1-a-*.test.*'
      - 'tests/sprint-1.7.1-b.test.mjs'
      - 'tests/sprint-1.7.1-b-ui.test.mjs'
      - 'tests/sprint-1.7.1-c.test.mjs'
      - 'js/services/triage-domain.mjs'
      - 'js/config/version.js'
      - 'service-worker.js'
      - 'tests/sprint-1.7.1-release.test.mjs'
      - 'js/ui/central.js'
      - 'js/ui/ticket-palette.mjs'
      - 'js/ui/home.js'
      - 'css/app.css'
      - 'js/services/opening-attempt.mjs'
      - 'js/services/opening-domain.mjs'
      - 'js/services/tickets.service.js'
      - 'js/main.js'
      - 'index.html'
      - '.github/workflows/storage-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-emulators:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependências isoladas
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Instalar dependências das Cloud Functions de HML
        run: npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - name: Verificar sintaxe do frontend e funções
        run: |
          node --check functions/index.js
          node --check functions/attachment-security.js
          node --check js/main.js
          node --check js/services/attachments.service.js
          node --check js/services/attachment-cancel.mjs
          node --check js/ui/ticket-detail.js
          node --check js/ui/signal-composer.js
          node --check js/services/opening-attempt.mjs
          node --check js/services/triage-domain.mjs
          node --check js/ui/central.js
          node --check js/ui/ticket-palette.mjs
          node --check js/ui/home.js
          node --check js/services/opening-domain.mjs
          node --check js/services/tickets.service.js
          node --check tests/sprint-1.7.1-a-emulator.test.cjs
      - name: Testar cancelamento de uploads no cliente
        run: node --test tests/attachment-cancel-1.7.0-b.test.mjs
      - name: Testar Voltar do Android no visualizador de imagens
        run: node --test tests/overlay-preview-navigation-1.7.0-c.test.mjs
      - name: Testar domínio de abertura e triagem da Sprint 1.7.1-A
        run: npm run test:1.7.1:domain
      - name: Testar interface de abertura e navegacao Android da Sprint 1.7.1-B
        run: npm run test:1.7.1:ui
      - name: Verificar identificação de versão e cache PWA 1.7.1.2
        run: node --test tests/sprint-1.7.1-release.test.mjs
      - name: Testar triagem e fila da Sprint 1.7.1-C
        run: npm run test:1.7.1:triage
      - name: Validar regras estáticas
        run: npm run test:storage:static
      - name: Validar testes existentes das funções
        run: npm test --prefix functions
      - name: Testar permissões reais nos emuladores Firestore e Storage
        run: npm run test:storage:emulator
