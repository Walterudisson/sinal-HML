name: Sinal Storage Rules - 1.7.0-A

on:
  pull_request:
    paths:
      - 'storage.rules'
      - 'firestore.rules'
      - 'firebase.json'
      - 'tests/storage-*'
      - 'package.json'
      - '.github/workflows/storage-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-emulators:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependências isoladas
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validar regras estáticas
        run: npm run test:storage:static
      - name: Testar permissões reais nos emuladores Firestore e Storage
        run: npm run test:storage:emulator
