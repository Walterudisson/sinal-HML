name: Sinal Segurança HML - Anexos

on:
  pull_request:
    paths:
      - 'storage.rules'
      - 'firestore.rules'
      - 'firebase.json'
      - 'tests/storage-*'
      - 'package.json'
      - 'functions/access-revocation.js'
      - 'functions/access-revocation.test.cjs'
      - 'functions/index.js'
      - 'functions/attachment-security.js'
      - 'functions/attachment-security.test.cjs'
      - 'functions/package.json'
      - 'js/services/attachments.service.js'
      - 'js/ui/ticket-detail.js'
      - 'js/main.js'
      - 'index.html'
      - '.github/workflows/storage-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-emulators:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependências isoladas
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Instalar dependências das Cloud Functions de HML
        run: npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - name: Verificar sintaxe do frontend e funções
        run: |
          node --check functions/index.js
          node --check functions/attachment-security.js
          node --check js/main.js
          node --check js/services/attachments.service.js
          node --check js/ui/ticket-detail.js
      - name: Validar regras estáticas
        run: npm run test:storage:static
      - name: Validar testes existentes das funções
        run: npm test --prefix functions
      - name: Testar permissões reais nos emuladores Firestore e Storage
        run: npm run test:storage:emulator
